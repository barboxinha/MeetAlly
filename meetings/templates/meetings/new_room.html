{% extends 'base.html' %}

{% block title %}New Room{% endblock %}

{% block container_class %}container-narrow{% endblock %}

{% block content %}
<a class="back-link" href="{% url 'rooms' %}">&lsaquo; All rooms</a>
<div class="card">
    <div class="page-title">
        <h1>Add a new Room</h1>
        <p>Give the room a name and where to find it.</p>
    </div>
    <form method="post">
        <div class="form-fields">
            {{ form }}
        </div>
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Create Room</button>
            <a class="btn btn-secondary" href="{% url 'rooms' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
