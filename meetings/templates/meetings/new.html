{% extends 'base.html' %}

{% block title %}New Meeting{% endblock %}

{% block container_class %}container-narrow{% endblock %}

<!-- The nice thing about Django is it can generate your form html based on your Models -->
{% block content %}
<a class="back-link" href="{% url 'welcome' %}">&lsaquo; All meetings</a>
<div class="card">
    <div class="page-title">
        <h1>Plan a New Meeting</h1>
        <p>Pick a time, a room, and who should attend.</p>
    </div>
    <form method="post">
        <div class="form-fields">
            {{ form }}
        </div>
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Create meeting</button>
            <a class="btn btn-secondary" href="{% url 'welcome' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
